# Camp Prep AI theme.
#
# Everything visual that Streamlit can express natively lives here rather than
# in CSS: colours, radii, type scale and the chart sequence. The colour values
# are the ones in utils/palette.py - if you change a colour, change it in both
# places, and nowhere else.
#
# The semantic families (red/green/orange/blue/gray) are what st.info,
# st.success, st.warning, st.error and coloured markdown draw from, so pointing
# them at the palette keeps alerts on-brand without any custom styling.

[theme]
base = "light"

primaryColor = "#1B2CC1"           # palette.PRIMARY
backgroundColor = "#F6F7FE"        # palette.CANVAS
secondaryBackgroundColor = "#EEF0FC"
textColor = "#0E1340"              # palette.INK
linkColor = "#1B2CC1"
linkUnderline = false
borderColor = "#E2E5F5"            # palette.BORDER
dataframeBorderColor = "#E2E5F5"
dataframeHeaderBackgroundColor = "#EEF0FC"

# Type. Plus Jakarta Sans for its rounded, friendly geometry - it reads well
# at the small sizes a mark sheet needs. Streamlit falls back to its own sans
# stack when Google Fonts is unreachable (offline, or a school filter), so the
# app still looks right without it.
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
codeFont = "ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace"
baseFontSize = 15
headingFontSizes = ["2.1rem", "1.5rem", "1.2rem", "1.02rem", "0.95rem", "0.9rem"]
headingFontWeights = [800, 800, 700, 700, 650, 650]
metricValueFontSize = "1.8rem"
metricValueFontWeight = 800

# Shape. Soft, generous corners - the app is for 12 to 15 year olds.
baseRadius = "1rem"
buttonRadius = "0.85rem"
showWidgetBorder = true
showSidebarBorder = false

# Semantic families, mapped onto the palette.
blueColor = "#1B2CC1"
blueBackgroundColor = "#E6E9FC"
blueTextColor = "#16218F"
greenColor = "#76C457"
greenBackgroundColor = "#E8F6E1"
greenTextColor = "#35711E"
redColor = "#DF301C"
redBackgroundColor = "#FDE5E1"
redTextColor = "#962010"
orangeColor = "#FF9100"
orangeBackgroundColor = "#FFF0DB"
orangeTextColor = "#8A4E00"
yellowColor = "#FF9100"
yellowBackgroundColor = "#FFF6E5"
yellowTextColor = "#8A4E00"
violetColor = "#2F39A9"
violetBackgroundColor = "#ECEEFA"
violetTextColor = "#232C82"
grayColor = "#555C85"
grayBackgroundColor = "#F1F3FC"
grayTextColor = "#3A4170"

# Charts read from the same six colours as the rest of the UI. Green and red
# come last so a two-series chart never accidentally implies correct/incorrect.
chartCategoricalColors = ["#1B2CC1", "#1DCED8", "#2F39A9", "#FF9100", "#76C457", "#DF301C"]
chartSequentialColors = [
  "#EEF0FC", "#D6DAF6", "#B6BDEE", "#8F9AE3", "#6874D6",
  "#4553CA", "#2F39A9", "#252D89", "#1B2168", "#121647",
]


# The sidebar is the one dark surface: a deep indigo rail that the white
# content canvas sits against. Cyan marks the active item.
[theme.sidebar]
backgroundColor = "#141E8C"
secondaryBackgroundColor = "#26319F"
textColor = "#E9ECFF"
primaryColor = "#1DCED8"
linkColor = "#1DCED8"
borderColor = "#3440B0"
codeBackgroundColor = "#26319F"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false

# Hide Streamlit's developer toolbar (Deploy button, rerun/settings menu) from
# students and teachers; only the app's own menu items remain.
[client]
toolbarMode = "minimal"
